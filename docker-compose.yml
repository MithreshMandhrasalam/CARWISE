version: '3.9'

services:
  # ── MongoDB ────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: autotrust_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: autotrust_ai
    networks:
      - autotrust_net

  # ── Node.js / Express API ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autotrust_backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/autotrust_ai
      AI_SERVICE_URL: http://ai-service:8000
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_uploads:/app/uploads
    depends_on:
      - mongo
      - ai-service
    networks:
      - autotrust_net

  # ── Python FastAPI AI Service ──────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: autotrust_ai_service
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - ./ai-service/.env
    volumes:
      - ./ai-service:/app
      - ai_model_weights:/app/app/ml/weights
    networks:
      - autotrust_net

  # ── Next.js Frontend ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autotrust_frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - ./frontend/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    depends_on:
      - backend
    networks:
      - autotrust_net

volumes:
  mongo_data:
  backend_uploads:
  ai_model_weights:

networks:
  autotrust_net:
    driver: bridge
